services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: packages
      POSTGRES_PASSWORD: packages
      POSTGRES_DB: packages
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U packages"]
      interval: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://packages:packages@db:5432/packages
      STORAGE_DIR: /data
      AUTH_TOKEN_FILE: /secrets/tokens
      RUST_LOG: info
    volumes:
      - ./data:/data
      - ./dev.tokens:/secrets/tokens:ro
    depends_on:
      db:
        condition: service_healthy

  # Optional S3 backend: `docker compose --profile s3 up minio minio-init`,
  # then set STORAGE_BACKEND=s3, S3_BUCKET=packages,
  # S3_ENDPOINT_URL=http://minio:9000, AWS_ACCESS_KEY_ID=minioadmin, and
  # AWS_SECRET_ACCESS_KEY=minioadmin on the app service.
  minio:
    image: quay.io/minio/minio:latest
    profiles: [s3]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: quay.io/minio/mc:latest
    profiles: [s3]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/packages;
      "

volumes:
  pgdata:
  miniodata:
