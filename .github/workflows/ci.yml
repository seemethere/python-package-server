name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres for tests/postgres.rs (PgStore, migrations, conflicts).
    # Without TEST_DATABASE_URL those tests skip, so local `cargo test`
    # still needs no database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: packages
          POSTGRES_PASSWORD: packages
          POSTGRES_DB: packages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packages"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # MinIO for tests/s3.rs. Started with docker run (the service
      # container cannot pass MinIO's `server` command reliably).
      - name: Start MinIO for S3 tests
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/ready && break
            sleep 2
          done
      - run: cargo test --locked
        env:
          TEST_DATABASE_URL: postgres://packages:packages@localhost:5432/packages
          TEST_S3_ENDPOINT: http://localhost:9000

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
