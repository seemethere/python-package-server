name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Real Postgres for tests/postgres.rs (PgStore, migrations, conflicts).
    # Without TEST_DATABASE_URL those tests skip, so local `cargo test`
    # still needs no database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: packages
          POSTGRES_PASSWORD: packages
          POSTGRES_DB: packages
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U packages"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # S3-compatible endpoint for tests/s3.rs (Adobe S3Mock; MinIO no
      # longer publishes pullable images). Any HTTP response means up.
      - name: Start S3Mock for S3 tests
        run: |
          docker run -d --name s3mock -p 9000:9090 \
            -e COM_ADOBE_TESTING_S3MOCK_STORE_INITIALBUCKETS=pps-test \
            adobe/s3mock:latest
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:9000/ && break
            sleep 2
          done
          curl -s http://localhost:9000/ | head -c 200
      - run: cargo test --locked
        env:
          TEST_DATABASE_URL: postgres://packages:packages@localhost:5432/packages
          TEST_S3_ENDPOINT: http://localhost:9000

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # packages:write lets the build push its BuildKit cache image to
    # GHCR (below). Fork PRs get a read-only token regardless, so they
    # cannot write it, and may not read it either while the package is
    # private — they just build uncached rather than fail.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry cache, not type=gha: the GHA cache is scoped per git
      # ref and capped at 10 GB per repo, so stacked PR branches could
      # not read each other's (or main's) exported layers, identical
      # blobs were stored once per ref, and eviction kept dropping the
      # cooked-dependency layer — most builds re-ran the full
      # `cargo chef cook` compile. A GHCR cache image is shared by all
      # branches, deduplicates blobs by digest, and has no such cap.
      # ignore-error keeps read-only fork-PR tokens (which can restore
      # but not push cache) from failing the build on export.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,ignore-error=true

  publish:
    # Push the release image to GHCR on main and version tags only.
    # PRs and other branches exercise the `docker` build job above
    # without pushing. Gated on `test` so broken code never publishes.
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          # Resolves to ghcr.io/seemethere/python-package-server.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache,mode=max,ignore-error=true
