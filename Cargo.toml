[package]
name = "python-package-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Private Python package server (PEP 503/691) with Postgres metadata and pluggable storage"
license = "MIT OR Apache-2.0"

[[bin]]
name = "python-package-server"
path = "src/main.rs"

[dependencies]
aws-config = "1"
aws-sdk-s3 = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
hex = "0.4"
http-body-util = "0.1"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
mime = "0.3"
pep440_rs = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5", features = ["util", "limit"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uv-distribution-filename = "0.0"
uv-normalize = "0.0"

[dev-dependencies]
tempfile = "3"
