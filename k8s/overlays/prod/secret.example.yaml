# WARNING: EXAMPLE ONLY — NEVER commit a real secret to git.
# This file is NOT referenced by kustomization.yaml. An admin creates the
# real `package-server-secrets` Secret out-of-band before applying the prod
# overlay:
#
#   kubectl -n packages create secret generic package-server-secrets \
#     --from-literal=POSTGRES_PASSWORD='REPLACE-ME-STRONG-PASSWORD' \
#     --from-literal=DATABASE_URL='postgres://packages:REPLACE-ME-STRONG-PASSWORD@postgres:5432/packages' \
#     --from-file=tokens=/path/to/tokens
#
# Rules:
# - POSTGRES_PASSWORD must be a strong generated value (e.g. from
#   `openssl rand -base64 32`); there is no default.
# - The password embedded in DATABASE_URL MUST match POSTGRES_PASSWORD, or
#   the app cannot authenticate to the in-cluster Postgres.
# - The secret key MUST be named `tokens`: the deployment projects it as
#   the file /secrets/auth/tokens, which the server reads as
#   AUTH_TOKEN_FILE. Token file format: one `user:token` per line,
#   `#` comments and blank lines ignored.
# - Managed-Postgres alternative: skip the in-cluster StatefulSet (use the
#   base kustomization instead of this overlay) and set DATABASE_URL to
#   your managed instance; POSTGRES_PASSWORD is then unused.
apiVersion: v1
kind: Secret
metadata:
  name: package-server-secrets
stringData:
  POSTGRES_PASSWORD: REPLACE-ME-STRONG-PASSWORD
  DATABASE_URL: postgres://packages:REPLACE-ME-STRONG-PASSWORD@postgres:5432/packages
  tokens: |
    ci:REPLACE-ME
