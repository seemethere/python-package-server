# WARNING: EXAMPLE ONLY — NEVER commit a real secret to git.
# This file is NOT referenced by kustomization.yaml. An admin creates the
# real `package-server-secrets` Secret out-of-band (e.g. kubectl create
# secret generic package-server-secrets --from-literal=DATABASE_URL=... \
# --from-file=tokens=/path/to/tokens).
#
# NOTE: the secret key MUST be named `tokens`: the deployment projects it
# as the file /secrets/auth/tokens, which the server reads as
# AUTH_TOKEN_FILE. Token file format: one `user:token` per line,
# `#` comments and blank lines ignored.
apiVersion: v1
kind: Secret
metadata:
  name: package-server-secrets
stringData:
  DATABASE_URL: postgres://packages:packages@postgres:5432/packages
  tokens: |
    ci:REPLACE-ME
