# Default upstream-quarantine policy (quarantine off), mounted at
# /config/policy.json and read once at startup via POLICY_FILE (see the base
# deployment). The shipped default is behavior-preserving; add per-package
# overrides below to enable quarantine. The policy is
# NOT hot-reloaded: after editing this ConfigMap, restart the pods
# (kubectl -n packages rollout restart deploy/package-server). The subPath
# mount below also pins each pod to the file contents from its start time.
#
# Shape: {"default": {"upstream_quarantine_days": N}, "packages":
# {"<project>": {"upstream_quarantine_days": N}}}. 0 disables quarantine for
# that scope; hosted files are never quarantined.
apiVersion: v1
kind: ConfigMap
metadata:
  name: package-server-policy
data:
  policy.json: |
    {
      "default": { "upstream_quarantine_days": 0 },
      "packages": {}
    }
